  :root{
    --green: #58CC02;
    --green-dark: #46A302;
    --blue: #1CB0F6;

    --gold: #FFC800;

    --red: #FF4B4B;

    --text-light: #6b7280;

    --border: #E5E5E5;
    --radius-lg: 20px;
    --radius-md: 14px;

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html,body{

  #page{
    max-width: 480px;

    background: var(--bg);
    display:flex;

  /* TOPBAR */
  #topbar{
    position: sticky;
    top:0;
    z-index: 10;
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 10px 16px 12px;
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .level-label{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .score-badge{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 15px;
    background: #FFF8E1;
    color:#B8860B;
    border: 2px solid var(--gold);
    border-radius: 999px;
    padding: 4px 12px;
    white-space: nowrap;
    flex-shrink:0;
  }
  .score-max{ font-weight:600; opacity:.7; font-size:12px; }
  .progress-track{
    background: #E5E5E5;
    border-radius: 999px;
    height: 12px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--green), #7ED321);
    border-radius: 999px;
    transition: width .4s ease;
  }

  /* LAYOUT */
  main#content{
    flex:1;
    padding: 20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .3px;
    text-transform: uppercase;
    border: none;
    border-radius: 16px;
    padding: 15px 20px;
    cursor: pointer;
    color: #fff;
    background: var(--green);
    box-shadow: 0 4px 0 var(--green-dark);
    transition: transform .05s ease, box-shadow .05s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-block{ width:100%; margin-top:auto; position: sticky; bottom: 16px; }

  .letter-box.filled{

  }

  @media (prefers-reduced-motion: reduce){

  }

const state = {

  qIndex: 0,
  totalScore: 0,
  levelScores: {1:0, 2:0},
  l1: null,

};

// Utilidades
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getRandomLetter(){
  const alphabet = "abcdefghijklmnopqrstuvwxyz";
  return alphabet[Math.floor(Math.random()*alphabet.length)];
}

function formatScore(n){
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

/* HELPER PARA GERAR BANCO DE TECLAS SEM ESPAÇO */
function buildKeyBank(targetStr){
  const cleanStr = targetStr.replace(/ /g, '');
  let chars = cleanStr.split('');
  chars.push(getRandomLetter());
  chars = shuffle(chars);
  return chars.map((char, index) => ({
    id: index,
    char: char
  }));
}

/* SONOPLASTIA */
const SOUND_FILES = {
  click: 'click.mp3',
  ok: 'ok.mp3',
  falha: 'falha.mp3',
  level: 'level.mp3',
  levelfail: 'levelfail.mp3',
  win: 'win01.mp3',
  losing: 'losing.mp3'
};

function playSound(name){
  try{
    const src = SOUND_FILES[name];
    if(!src) return;
    const audio = new Audio(src);
    audio.play().catch(()=>{});
  }catch(e){}
}

function levelMaxPts(lvl){ return lvl===1 ? 400 : 600; }
function levelPct(lvl){ return (state.levelScores[lvl]/levelMaxPts(lvl))*100; }

function startGame(){
  playSound('click');
  state.screen='game'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0, 2:0};
  setupCurrentQuestion();
  render();
}

function setupCurrentQuestion(){
  if(state.level===1) setupLevel1Question(state.qIndex);
  else setupLevel2Question(state.qIndex);
}

function nextQuestion(){
  playSound('click');
  state.qIndex++;
  if(state.qIndex>=10){
    state.screen='levelComplete';
    playSound(levelPct(state.level)>=70 ? 'level' : 'levelfail');
    render();
    return;
  }
  setupCurrentQuestion();
  render();
}

function startNextLevel(){
  playSound('click');
  state.level++; state.qIndex=0; state.screen='game';
  setupCurrentQuestion();
  render();
}

function goFinal(){
  playSound('click');
  state.screen='final';
  playSound(state.totalScore>=750 ? 'win' : 'losing');
  render();
}

function resetGame(){
  playSound('click');
  state.screen='home'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0, 2:0};
  render();
}

  renderTopbar();
  const content = document.getElementById('content');
  if(state.screen==='home'){ content.innerHTML = homeTemplate(); }
  else if(state.screen==='game'){
    if(state.level===1) renderLevel1();
    else renderLevel2();
  }
  else if(state.screen==='levelComplete'){ content.innerHTML = levelCompleteTemplate(); }
  else if(state.screen==='final'){ content.innerHTML = finalTemplate(); }
}

function renderTopbar(){
  const bar = document.getElementById('topbar');
  const scoreTxt = formatScore(state.totalScore);
  let progressPct = 0;
  let levelLabel = 'GALOLINGO — LES LÉGUMES';
  if(state.screen==='game'){
    const completed = (state.level-1)*10 + state.qIndex;
    progressPct = Math.round((completed/20)*100);
    levelLabel = `Nível ${state.level} · Questão ${state.qIndex+1}/10`;
  } else if(state.screen==='levelComplete'){
    progressPct = Math.round((state.level*10/20)*100);
    levelLabel = `Nível ${state.level} concluído`;
  } else if(state.screen==='final'){
    progressPct = 100;
    levelLabel = 'Jogo concluído';
  } else {
    levelLabel = 'Pronto para começar?';
  }
  bar.innerHTML = `
    <div class="topbar-row">
      <span class="level-label">${levelLabel}</span>
      <span class="score-badge">🏆 ${scoreTxt}<span class="score-max">/1000</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  `;
}

function homeTemplate(){
  return `
    <div class="home-card">
      <div class="mascot">🐓</div>
      <h1>GALOLINGO</h1>
      <p class="home-sub">Tema: <strong>Les légumes</strong>. Complete os 2 níveis e conquiste até <strong>1000 pontos</strong>!</p>
      <div class="level-preview">
        <div class="level-chip"><span class="chip-num">1</span> Montar Letra por Letra + Lacuna <span class="chip-pts">400 pts</span></div>
        <div class="level-chip"><span class="chip-num">2</span> Montar Duas Lacunas Letra por Letra <span class="chip-pts">600 pts</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="startGame()">Começar</button>
  `;
}

function levelCompleteTemplate(){
  const lvl = state.level;
  const max = levelMaxPts(lvl);
  const earned = state.levelScores[lvl];
  const pct = levelPct(lvl);
  const passed = pct>=70;
  const mascot = passed ? '🐓😄' : '🐓😟';
  const moodMsg = passed
    ? 'Muito bem! Esse galo está orgulhoso do seu progresso!'
    : 'Esse galo ficou meio apreensivo... vamos revisar mais um pouco!';
  const isLast = lvl===2;
  return `
    <div class="home-card">
      <div class="mascot">${mascot}</div>
      <h1>Nível ${lvl} concluído!</h1>
      <p class="home-sub">Você fez <strong>${formatScore(earned)} / ${max}</strong> pontos neste nível (${Math.round(pct)}%).</p>
      <p class="home-sub">${moodMsg}</p>
      <p class="home-sub">Pontuação total: <strong>${formatScore(state.totalScore)} / 1000</strong></p>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="${isLast ? 'goFinal()' : 'startNextLevel()'}">
      ${isLast ? 'Ver Resultado Final' : 'Continuar para o Nível '+(lvl+1)}
    </button>
  `;
}

function finalTemplate(){
  const total = state.totalScore;
  const passed = total>=750;
  const mascot = passed ? '🐓🥳' : '🐓😭';
  const msg = passed
    ? 'Parabéns! Esse galo está cantando de alegria — você mandou muito bem em francês! 🎉'
    : 'Esse galo ficou super triste... capriche mais um pouco na próxima tentativa e tenha mais dedicação nos estudos! 💪';
  return `
    <div class="home-card">
      <div class="mascot">${mascot}</div>
      <h1>Resultado Final</h1>
      <p class="final-score">${formatScore(total)}<span> / 1000</span></p>
      <p class="home-sub">${msg}</p>
      <div class="breakdown">
        <div class="breakdown-row"><span>Nível 1 — Letra por Letra + Lacuna</span><span>${formatScore(state.levelScores[1])} / 400</span></div>
        <div class="breakdown-row"><span>Nível 2 — Montagem Dupla</span><span>${formatScore(state.levelScores[2])} / 600</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="resetGame()">Jogar Novamente</button>
  `;
}

/* =========================================================
   NÍVEL 1 — LÓGICA E INTERFACE (400 PONTOS)
   ========================================================= */
function setupLevel1Question(idx){
  const q = level1Data[idx];
  state.l1 = {
    step: 'A',
    selectedItems: [], // array de objetos { id, char }
    keyBank: buildKeyBank(q.targetSpelling),
    l2Opts: shuffle(q.l2Opts),
    l2Selected: null,
    checkedA: false,
    trOptions: shuffle([{text:q.transCorrect, correct:true}, ...q.transWrong.map(w=>({text:w, correct:false}))]),
    trSelected: null,
    checkedB: false
  };
}

// Renderizar quadrados de montagem mantendo alinhamento de texto e espaços visuais
function renderSpellingBoxesInteractive(target, selectedItems, checked, isCorrect, levelNum, fieldNum){
  let html = '<span class="word-spelling-wrap">';
  let itemIdx = 0;

  for(let i=0; i<target.length; i++){
    const charTarget = target[i];
    
    if(charTarget === ' '){
      html += `<span class="letter-box space-box"></span>`;
    } else {
      const selectedObj = selectedItems[itemIdx];
      let cls = "letter-box";
      let displayChar = "";

      if(checked){
        cls += isCorrect ? " correct" : " wrong";
        if(selectedObj) displayChar = selectedObj.char;
      } else if(selectedObj){
        cls += " filled";
        displayChar = selectedObj.char;
      }

      const clickHandler = (!checked && selectedObj) ? `onclick="removeTile(${levelNum}, ${fieldNum}, ${itemIdx})"` : '';
      html += `<span class="${cls}" ${clickHandler}>${displayChar}</span>`;
      itemIdx++;
    }
  }
  html += '</span>';
  return html;
}

function renderLevel1(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const target = q.targetSpelling;
    const typedString = s.selectedItems.map(item => item.char).join('');
    const expectedLettersOnly = target.replace(/ /g, '');
    const isSpellingOk = (typedString.toLowerCase() === expectedLettersOnly.toLowerCase());

    const spellingHtml = renderSpellingBoxesInteractive(target, s.selectedItems, s.checkedA, isSpellingOk, 1, 1);

    // Render da frase com as lacunas
    let l2Span = "[ ___ ]";
    if(s.l2Selected !== null) l2Span = s.l2Opts[s.l2Selected];
    let l2Cls = "blank";
    if(s.checkedA){
      l2Cls += (s.l2Opts[s.l2Selected] === q.l2Correct) ? " blank-correct" : " blank-wrong";
    } else if(s.l2Selected !== null) l2Cls += " blank-filled";

    const sentence = q.frTemplate.replace('{SPELLING}', spellingHtml).replace('[ 2 ]', `<span class="${l2Cls}">${l2Span}</span>`);

    // Teclado virtual (Sem botão de espaço)
    const keyBtns = s.keyBank.map((item) => {
      const isUsed = s.selectedItems.some(sel => sel.id === item.id);
      let cls = 'key-btn';
      if(isUsed) cls += ' used';

      const clickHandler = (!s.checkedA && !isUsed) ? `onclick="pickTile(1, 1, ${item.id})"` : '';

      return `<button class="${cls}" ${s.checkedA || isUsed ? 'disabled' : ''} ${clickHandler}>${item.char}</button>`;
    }).join('');

    // Botões da lacuna 2
    const l2Btns = s.l2Opts.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.l2Correct) cls+=' correct'; else if(i===s.l2Selected) cls+=' wrong'; }
      else if(i===s.l2Selected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL1Opt(${i})">${w}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'Continuar' : 'Verificar Respostas';
    const btnOnclick = s.checkedA ? 'advanceL1Step()' : 'checkL1StepA()';
    const btnDisabled = !s.checkedA && (s.selectedItems.length < expectedLettersOnly.length || s.l2Selected===null);

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Monte o partitivo+substantivo e escolha a 2ª palavra</p>
        <p class="fr-sentence">${sentence}</p>
        
        <p class="chip-label">Teclado de Letras (Lacuna 1)</p>
        <div class="keyboard-grid">${keyBtns}</div>

        <p class="chip-label">Opções da Lacuna 2</p>
        <div class="chip-row">${l2Btns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL1Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'Próxima Questão' : 'Verificar Tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL1Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL1Opt(i){ playSound('click'); state.l1.l2Selected=i; renderLevel1(); }

function checkL1StepA(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  s.checkedA = true;

  // Verificação em tempo real no exato momento da ação de checagem
  const typedString = s.selectedItems.map(item => item.char).join('');
  const expectedLettersOnly = q.targetSpelling.replace(/ /g, '');
  const isSpellOk = (typedString.toLowerCase() === expectedLettersOnly.toLowerCase());
  const isL2Ok = (s.l2Opts[s.l2Selected] === q.l2Correct);

  // Sistema de Pontuação Nível 1 (Max 30 pts no Step A):
  // A montagem de palavra tem peso maior e é proporcional ao número de letras.
  // 22 pts distribuídos proporcionalmente por letra + 8 pts na escolha da lacuna de múltipla escolha.
  let pts = 0;
  if(isSpellOk) {
    pts += 22; 
  }
  if(isL2Ok) {
    pts += 8;
  }

  state.levelScores[1] += pts;
  state.totalScore += pts;

  if(isSpellOk && isL2Ok) playSound('ok'); else playSound('falha');
  renderLevel1();
}

function advanceL1Step(){ playSound('click'); state.l1.step='B'; renderLevel1(); }

function selectL1Translation(i){ playSound('click'); state.l1.trSelected=i; renderLevel1(); }

function checkL1Translation(){
  const s = state.l1;
  s.checkedB = true;
  const isCorrect = s.trOptions[s.trSelected].correct;
  if(isCorrect){
    playSound('ok');
    state.levelScores[1] += 10; // Tradução vale 10 pts no Nível 1
    state.totalScore += 10;
  } else {
    playSound('falha');
  }
  renderLevel1();
}

/* =========================================================
   NÍVEL 2 — LÓGICA E INTERFACE (600 PONTOS)
   ========================================================= */
function setupLevel2Question(idx){
  const q = level2Data[idx];

  state.l2 = {
    step: 'A',
    activeField: 1, // 1 ou 2
    selectedItems1: [],
    selectedItems2: [],
    keyBank1: buildKeyBank(q.spelling1),
    keyBank2: buildKeyBank(q.spelling2),
    checkedA: false,
    trOptions: shuffle([{text:q.transCorrect, correct:true}, ...q.transWrong.map(w=>({text:w, correct:false}))]),
    trSelected: null,
    checkedB: false
  };
}

function renderLevel2(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const typed1 = s.selectedItems1.map(i => i.char).join('');
    const typed2 = s.selectedItems2.map(i => i.char).join('');

    const expected1 = q.spelling1.replace(/ /g, '');
    const expected2 = q.spelling2.replace(/ /g, '');

    const isSpell1Ok = (typed1.toLowerCase() === expected1.toLowerCase());
    const isSpell2Ok = (typed2.toLowerCase() === expected2.toLowerCase());

    const sp1Html = renderSpellingBoxesInteractive(q.spelling1, s.selectedItems1, s.checkedA, isSpell1Ok, 2, 1);
    const sp2Html = renderSpellingBoxesInteractive(q.spelling2, s.selectedItems2, s.checkedA, isSpell2Ok, 2, 2);

    const sentence = q.frTemplate.replace('{SP1}', sp1Html).replace('[ 2 ]', sp2Html);

    const active1Cls = s.activeField===1 ? 'selected' : '';
    const active2Cls = s.activeField===2 ? 'selected' : '';

    const currentBank = s.activeField===1 ? s.keyBank1 : s.keyBank2;
    const currentSelected = s.activeField===1 ? s.selectedItems1 : s.selectedItems2;

    // Teclado virtual sem botão espaço
    const keyBtns = currentBank.map((item) => {
      const isUsed = currentSelected.some(sel => sel.id === item.id);
      let cls = 'key-btn';
      if(isUsed) cls += ' used';

      const clickHandler = (!s.checkedA && !isUsed) ? `onclick="pickTile(2, ${s.activeField}, ${item.id})"` : '';

      return `<button class="${cls}" ${s.checkedA || isUsed ? 'disabled' : ''} ${clickHandler}>${item.char}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'Continuar' : 'Verificar Frases';
    const btnOnclick = s.checkedA ? 'advanceL2Step()' : 'checkL2StepA()';
    const btnDisabled = !s.checkedA && (s.selectedItems1.length < expected1.length || s.selectedItems2.length < expected2.length);

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Monte ambas as lacunas letra por letra</p>
        <p class="fr-sentence">${sentence}</p>

        <p class="chip-label">Selecione qual lacuna deseja preencher:</p>
        <div class="chip-row">
          <button class="chip-option ${active1Cls}" ${s.checkedA?'disabled':''} onclick="switchL2Field(1)">Lacuna 1</button>
          <button class="chip-option ${active2Cls}" ${s.checkedA?'disabled':''} onclick="switchL2Field(2)">Lacuna 2</button>
        </div>

        <p class="chip-label">Teclado de Letras (Lacuna ${s.activeField})</p>
        <div class="keyboard-grid">${keyBtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL2Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'Próxima Questão' : 'Verificar Tradução';
    const btnOnclick = s.checkedB ? 'nextQuestion()' : 'checkL2Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function switchL2Field(f){
  playSound('click');
  state.l2.activeField = f;
  renderLevel2();
}

/* =========================================================
   FUNÇÕES GERAIS DE INTERAÇÃO COM AS LETRAS DO TECLADO
   ========================================================= */

// Escolher uma letra do banco
function pickTile(levelNum, fieldNum, itemId){
  playSound('click');
  if(levelNum === 1){
    const s = state.l1;
    const item = s.keyBank.find(k => k.id === itemId);
    if(item && !s.selectedItems.some(i => i.id === itemId)){
      s.selectedItems.push(item);
      renderLevel1();
    }
  } else if(levelNum === 2){
    const s = state.l2;
    const bank = fieldNum === 1 ? s.keyBank1 : s.keyBank2;
    const selectedList = fieldNum === 1 ? s.selectedItems1 : s.selectedItems2;
    const item = bank.find(k => k.id === itemId);
    if(item && !selectedList.some(i => i.id === itemId)){
      selectedList.push(item);
      renderLevel2();
    }
  }
}

// Remover uma letra clicando diretamente na caixa cinza (permite correção simples)
function removeTile(levelNum, fieldNum, itemIndex){
  playSound('click');
  if(levelNum === 1){
    const s = state.l1;
    if(!s.checkedA){
      s.selectedItems.splice(itemIndex, 1);
      renderLevel1();
    }
  } else if(levelNum === 2){
    const s = state.l2;
    if(!s.checkedA){
      const selectedList = fieldNum === 1 ? s.selectedItems1 : s.selectedItems2;
      selectedList.splice(itemIndex, 1);
      renderLevel2();
    }
  }
}

function checkL2StepA(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  s.checkedA = true;

  // Verificação em tempo real
  const typed1 = s.selectedItems1.map(i => i.char).join('');
  const typed2 = s.selectedItems2.map(i => i.char).join('');

  const expected1 = q.spelling1.replace(/ /g, '');
  const expected2 = q.spelling2.replace(/ /g, '');

  const isOk1 = (typed1.toLowerCase() === expected1.toLowerCase());
  const isOk2 = (typed2.toLowerCase() === expected2.toLowerCase());

  // Sistema de Pontuação Nível 2 (Max 48 pts no Step A):
  // As duas lacunas são compostas por montagem de palavras.
  // A pontuação é dividida entre as duas proporcionalmente ao tamanho (quantidade de letras) de cada uma.
  const len1 = expected1.length;
  const len2 = expected2.length;
  const totalLen = len1 + len2;

  let pts = 0;
  if(isOk1) {
    pts += (len1 / totalLen) * 48;
  }
  if(isOk2) {
    pts += (len2 / totalLen) * 48;
  }

  state.levelScores[2] += pts;
  state.totalScore += pts;

  if(isOk1 && isOk2) playSound('ok'); else playSound('falha');
  renderLevel2();
}

function advanceL2Step(){ playSound('click'); state.l2.step='B'; renderLevel2(); }

function selectL2Translation(i){ playSound('click'); state.l2.trSelected=i; renderLevel2(); }

function checkL2Translation(){
  const s = state.l2;
  s.checkedB = true;
  const isCorrect = s.trOptions[s.trSelected].correct;
  if(isCorrect){
    playSound('ok');
    state.levelScores[2] += 12; // Tradução vale 12 pts no Nível 2
    state.totalScore += 12;
  } else {
    playSound('falha');
  }
  renderLevel2();
}

// Inicialização
window.onload = () => { render(); };
</script>

</html>
