<style>
  :root{
    --green: #58CC02;
    --green-dark: #46A302;
    --blue: #1CB0F6;
    --blue-dark: #1899D6;
    --gold: #FFC800;
    --gold-dark: #E6B400;
    --red: #FF4B4B;
    --red-dark: #EA2B2B;
    --text: #3C3C3C;
    --text-light: #6b7280;
    --bg: #F7F9FA;
    --card: #FFFFFF;
    --border: #E5E5E5;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; }
  h1,h2,h3{ font-family:'Baloo 2', sans-serif; margin:0; }

  #page{ max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); display:flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.06); }

  /* TOPBAR */
  #topbar{ position: sticky; top:0; z-index: 10; background: var(--card); border-bottom: 2px solid var(--border); padding: 10px 16px 12px; }
  .topbar-row{ display:flex; align-items:center; justify-content: space-between; gap:10px; margin-bottom:8px; }
  .level-label{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 15px; color: var(--text); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
  .score-badge{ font-family:'Baloo 2', sans-serif; font-weight:700; font-size: 15px; background: #FFF8E1; color:#B8860B; border: 2px solid var(--gold); border-radius: 999px; padding: 4px 12px; white-space: nowrap; flex-shrink:0; }
  .score-max{ font-weight:600; opacity:.7; font-size:12px; }
  .progress-track{ background: #E5E5E5; border-radius: 999px; height: 12px; overflow:hidden; }
  .progress-fill{ height:100%; background: linear-gradient(90deg, var(--green), #7ED321); border-radius: 999px; transition: width .4s ease; }

  /* LAYOUT */
  main#content{ flex:1; padding: 20px 16px 12px; display:flex; flex-direction:column; gap:16px; }

  .btn{
    font-family:'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .3px; text-transform: uppercase;
    border: none; border-radius: 16px; padding: 15px 20px; cursor: pointer; color: #fff; background: var(--green);
    box-shadow: 0 4px 0 var(--green-dark); transition: transform .05s ease, box-shadow .05s ease, opacity .2s ease;
  }
  .btn:active:not(:disabled){ transform: translateY(4px); box-shadow: 0 0 0 var(--green-dark); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-blue{ background: var(--blue); box-shadow: 0 4px 0 var(--blue-dark); }
  .btn-blue:active:not(:disabled){ box-shadow: 0 0 0 var(--blue-dark); }
  .btn-block{ width:100%; margin-top:auto; position: sticky; bottom: 16px; z-index: 5; }

  .footer-space{ flex:1; }

  /* CARDS E ENTRADA */
  .home-card{ background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 24px 18px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px; animation: popIn .35s ease; }
  .input-name, .input-pin{ width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-md); font-family: 'Baloo 2', sans-serif; font-size: 20px; text-align: center; outline: none; }
  .input-pin{ letter-spacing: 4px; font-size: 24px; }
  .input-name:focus, .input-pin:focus{ border-color: var(--blue); }

  .qr-reader-box{ width: 100%; max-width: 300px; border-radius: var(--radius-md); overflow: hidden; border: 2px solid var(--blue); margin-top: 10px; }

  .tab-row{ display: flex; gap: 8px; width: 100%; margin-bottom: 8px; }
  .tab-btn{ flex: 1; padding: 10px; font-family: 'Baloo 2', sans-serif; font-weight: 700; border: 2px solid var(--border); border-radius: var(--radius-sm); background: #fff; cursor: pointer; }
  .tab-btn.active{ border-color: var(--blue); background: #EFF8FF; color: var(--blue-dark); }

  .char-grid{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-height: 220px; overflow-y: auto; padding: 4px; }
  .char-card{ border: 2px solid var(--border); border-radius: var(--radius-md); padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all .2s ease; }
  .char-card img{ width: 48px; height: 48px; object-fit: contain; }
  .char-card.selected{ border-color: var(--blue); background: #EFF8FF; }
  .char-name{ font-size: 12px; font-weight: 700; text-transform: uppercase; }

  .skin-selector{ display: flex; gap: 10px; margin-top: 4px; }
  .skin-btn{ border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 6px; cursor: pointer; background: #fff; }
  .skin-btn.selected{ border-color: var(--green); background: #EEFAE2; }
  .skin-btn img{ width: 40px; height: 40px; }

  /* GAMEPLAY & QUESTÕES */
  .question-card{ background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 20px; text-align: center; animation: popIn .3s ease; }
  .instruction{ font-size:13px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-light); font-weight:700; margin:0 0 12px; }
  .fr-sentence{ font-family:'Baloo 2', sans-serif; font-size: 20px; font-weight:600; color: var(--text); line-height:1.6; margin: 0 0 18px; text-align: center; }

  .word-spelling-wrap{ display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; justify-content: center; vertical-align: middle; margin: 0 2px; }
  .letter-box{ width: 25px; height: 30px; background: #E5E5E5; border: 2px solid #CCC; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); text-transform: uppercase; cursor: pointer; user-select: none; transition: all .1s ease; }
  .letter-box.filled{ background: #EFF8FF; border-color: var(--blue); color: var(--blue-dark); }
  .letter-box.correct{ background: #EEFAE2; border-color: var(--green); color: var(--green-dark); }
  .letter-box.wrong{ background: #FFEDED; border-color: var(--red); color: var(--red-dark); }

  .keyboard-grid{ display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; justify-content: center; }
  .key-btn{ font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; min-width: 32px; height: 36px; padding: 0 6px; background: #FFF; border: 2px solid var(--border); border-bottom-width: 3px; border-radius: 6px; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
  .key-btn.used{ opacity: 0.25; background: #E0E0E0; border-color: #CCC; cursor: not-allowed; }

  .options-grid{ display:flex; flex-direction:column; gap:10px; }
  .option-card{ font-family:'Nunito', sans-serif; font-weight:700; font-size: 15px; text-align:center; background: #fff; border: 2px solid var(--border); border-bottom-width:4px; border-radius: var(--radius-md); padding: 13px 16px; color: var(--text); cursor:pointer; }
  .option-card.selected{ border-color: var(--blue); background:#EFF8FF; color: var(--blue-dark); }
  .option-card.correct{ border-color: var(--green); background:#EEFAE2; color: var(--green-dark); }
  .option-card.wrong{ border-color: var(--red); background:#FFEDED; color: var(--red-dark); }

  .chip-label{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color: var(--text-light); margin: 14px 0 8px; text-align: center; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content: center; }
  .chip-option{ font-family:'Nunito', sans-serif; font-weight:700; font-size: 14px; background:#fff; border: 2px solid var(--border); border-bottom-width:4px; border-radius: 999px; padding: 8px 16px; cursor:pointer; }
  .chip-option.selected{ border-color: var(--blue); background:#EFF8FF; color:var(--blue-dark); }
  .chip-option.correct{ border-color: var(--green); background:#EEFAE2; color:var(--green-dark); }
  .chip-option.wrong{ border-color: var(--red); background:#FFEDED; color:var(--red-dark); }

  .blank{ display:inline-block; min-width: 30px; text-align:center; padding: 2px 8px; margin: 0 2px; border-radius: 8px; background: #EEE; color: var(--text-light); font-weight:800; border-bottom: 3px solid #CCC; }
  .blank-filled{ background:#EFF8FF; color: var(--blue-dark); border-bottom-color: var(--blue); }
  .blank-correct{ background:#EEFAE2; color: var(--green-dark); border-bottom-color: var(--green); }
  .blank-wrong{ background:#FFEDED; color: var(--red-dark); border-bottom-color: var(--red); }

  /* RANKING */
  .ranking-card{ background: var(--card); border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 16px; text-align: center; }
  .ranking-list{ display: flex; flex-direction: column; gap: 6px; margin-top: 10px; position: relative; }
  .ranking-item{ display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-md); font-weight: 700; font-size: 14px; transition: transform 0.5s ease; background: #E5E5E5; }
  .ranking-item.pos-1{ background: #FFD700; color: #5B4500; }
  .ranking-item.pos-2{ background: #C0C0C0; color: #333; }
  .ranking-item.pos-3{ background: #F5F5DC; color: #5C4033; }
  .ranking-item.pos-10{ background: #FF4B4B; color: #FFF; }

  .rank-pos{ font-family: 'Baloo 2', sans-serif; font-size: 16px; width: 24px; text-align: center; }
  .rank-avatar{ width: 32px; height: 32px; object-fit: contain; }
  .rank-name{ flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-score{ font-family: 'Baloo 2', sans-serif; font-size: 15px; }

  @keyframes popIn{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform: translateY(0); } }
</style>
</head>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAmD5ectyea8zeTkLurr0O2JjvV_t5jTWE",
    authDomain: "les-legumes.firebaseapp.com",
    databaseURL: "https://les-legumes-default-rtdb.firebaseio.com",
    projectId: "les-legumes",
    storageBucket: "les-legumes.firebasestorage.app",
    messagingSenderId: "116016913711",
    appId: "1:116016913711:web:97dea10d15e6ae760895da",
    measurementId: "G-BVZKHK3H61"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.dbSaveScore = async function(playerData) {
    try {
      await set(ref(db, 'leaderboard/' + playerData.id), playerData);
    } catch(e) {
      console.error("Erro ao salvar no Realtime Database:", e);
    }
  };

  window.dbFetchTop10 = async function() {
    try {
      const topQuery = query(ref(db, 'leaderboard'), orderByChild('score'), limitToLast(10));
      const snapshot = await get(topQuery);
      if (snapshot.exists()) {
        const list = [];
        snapshot.forEach((childSnapshot) => {
          list.push(childSnapshot.val());
        });
        return list.reverse();
      }
      return [];
    } catch(e) {
      console.error("Erro ao buscar no Realtime Database:", e);
      return [];
    }
  };
</script>

let qrScannerInstance = null;

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getRandomLetter(){
  const alphabet = "abcdefghijklmnopqrstuvwxyz";
  return alphabet[Math.floor(Math.random()*alphabet.length)];
}

function formatScore(n){
  const rounded = Math.round(n*10)/10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

function buildKeyBank(targetStr){
  let chars = targetStr.replace(/ /g, '').split('');
  chars.push(getRandomLetter());
  chars = shuffle(chars);
  return chars.map((char, index) => ({ id: index, char: char }));
}

function getAvatarPath(charName, skin){
  const suffix = skin === '01' ? '01.png' : '.png';
  return `./assets/${charName}${suffix}`;
}

const SOUND_FILES = { click: 'click.mp3', ok: 'ok.mp3', falha: 'falha.mp3', level: 'level.mp3', levelfail: 'levelfail.mp3', win: 'win01.mp3', losing: 'losing.mp3' };
function playSound(name){
  try{ const src = SOUND_FILES[name]; if(!src) return; new Audio(src).play().catch(()=>{}); }catch(e){}
}

/* FLUXO DE TELAS DO LOGIN */
function submitStudentLogin(pinCode){
  const pin = pinCode || document.getElementById('student-pin-input')?.value.trim();
  if(!pin){ alert("Por favor, digite ou escaneie um PIN válido."); return; }
  
  playSound('click');
  stopQrScanner();
  state.studentPin = pin;
  state.playerId = 'student_' + pin;
  state.screen = 'home';
  render();
}

function setLoginTab(mode){
  playSound('click');
  state.loginMode = mode;
  render();
  if(mode === 'qr'){ startQrScanner(); } else { stopQrScanner(); }
}

function startQrScanner(){
  setTimeout(() => {
    const qrDiv = document.getElementById('qr-reader');
    if(!qrDiv) return;
    qrScannerInstance = new Html5Qrcode("qr-reader");
    qrScannerInstance.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 200 },
      (decodedText) => {
        submitStudentLogin(decodedText);
      },
      () => {}
    ).catch(err => {
      console.warn("Erro ao iniciar câmera:", err);
    });
  }, 100);
}

function stopQrScanner(){
  if(qrScannerInstance){
    qrScannerInstance.stop().then(() => {
      qrScannerInstance.clear();
      qrScannerInstance = null;
    }).catch(() => {});
  }
}

function startGame(){
  const input = document.getElementById('player-name-input');
  if(input && input.value.trim() !== ''){ state.playerName = input.value.trim(); }
  else { state.playerName = "Aluno " + state.studentPin; }
  
  playSound('click');
  state.screen='game'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0, 2:0};
  setupCurrentQuestion();
  render();
}

function setupCurrentQuestion(){
  if(state.level===1) setupLevel1Question(state.qIndex);
  else setupLevel2Question(state.qIndex);
}

async function showRankingScreen(){
  if(window.dbSaveScore){
    await window.dbSaveScore({
      id: state.playerId,
      name: state.playerName,
      avatar: getAvatarPath(state.selectedChar, state.selectedSkin),
      score: state.totalScore
    });
  }
  
  let currentTop10 = [];
  if(window.dbFetchTop10){ currentTop10 = await window.dbFetchTop10(); }
  if(currentTop10.length === 0){
    currentTop10 = [
      { id: state.playerId, name: state.playerName, avatar: getAvatarPath(state.selectedChar, state.selectedSkin), score: state.totalScore },
      { id: 'bot1', name: 'Jean', avatar: getAvatarPath('JULIEN', '00'), score: 350 },
      { id: 'bot2', name: 'Claire', avatar: getAvatarPath('CHARLOTTE', '00'), score: 280 }
    ].sort((a,b) => b.score - a.score);
  }

  state.screen = 'ranking';
  renderRanking(currentTop10);
}

function nextQuestion(){
  playSound('click');
  state.qIndex++;
  if(state.qIndex>=10){
    state.screen='levelComplete';
    playSound((state.levelScores[state.level] >= (state.level===1?280:420)) ? 'level' : 'levelfail');
    render();
    return;
  }
  setupCurrentQuestion();
  render();
}

function startNextLevel(){
  playSound('click');
  state.level++; state.qIndex=0; state.screen='game';
  setupCurrentQuestion();
  render();
}

function goFinal(){
  playSound('click');
  state.screen='final';
  playSound(state.totalScore>=750 ? 'win' : 'losing');
  render();
}

function resetGame(){
  playSound('click');
  state.screen='login'; state.level=1; state.qIndex=0;
  state.totalScore=0; state.levelScores={1:0, 2:0};
  render();
}

/* RENDERIZADORES DE TELA */
function render(){
  renderTopbar();
  const content = document.getElementById('content');
  if(state.screen==='login'){ content.innerHTML = loginTemplate(); }
  else if(state.screen==='home'){ content.innerHTML = homeTemplate(); }
  else if(state.screen==='game'){
    if(state.level===1) renderLevel1();
    else renderLevel2();
  }
  else if(state.screen==='levelComplete'){ content.innerHTML = levelCompleteTemplate(); }
  else if(state.screen==='final'){ content.innerHTML = finalTemplate(); }
}

function renderTopbar(){
  const bar = document.getElementById('topbar');
  const scoreTxt = formatScore(state.totalScore);
  let progressPct = 0;
  let levelLabel = 'GALOLINGO — LES LÉGUMES';
  
  if(state.screen==='game' || state.screen==='ranking'){
    const completed = (state.level-1)*10 + state.qIndex;
    progressPct = Math.round((completed/20)*100);
    levelLabel = `Nível ${state.level} · Questão ${state.qIndex+1}/10`;
  } else if(state.screen==='levelComplete'){
    progressPct = Math.round((state.level*10/20)*100);
    levelLabel = `Nível ${state.level} concluído`;
  } else if(state.screen==='final'){
    progressPct = 100;
    levelLabel = 'Jogo concluído';
  }
  
  bar.innerHTML = `
    <div class="topbar-row">
      <span class="level-label">${levelLabel}</span>
      <span class="score-badge">🏆 ${scoreTxt}<span class="score-max">/1000</span></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  `;
}

function loginTemplate(){
  return `
    <div class="home-card">
      <h1>Área do Aluno</h1>
      <p class="instruction">Escolha a forma de acesso</p>
      
      <div class="tab-row">
        <button class="tab-btn ${state.loginMode==='pin'?'active':''}" onclick="setLoginTab('pin')">PIN da Turma</button>
        <button class="tab-btn ${state.loginMode==='qr'?'active':''}" onclick="setLoginTab('qr')">QR Code</button>
      </div>

      ${state.loginMode === 'pin' ? `
        <input type="number" id="student-pin-input" class="input-pin" placeholder="0000" maxlength="6">
      ` : `
        <div id="qr-reader" class="qr-reader-box"></div>
      `}
    </div>
    <div class="footer-space"></div>
    ${state.loginMode === 'pin' ? `
      <button class="btn btn-block btn-blue" onclick="submitStudentLogin()">Entrar</button>
    ` : ''}
  `;
}

function homeTemplate(){
  const charOptions = CHARACTERS.map(c => `
    <div class="char-card ${state.selectedChar === c ? 'selected' : ''}" onclick="selectChar('${c}')">
      <img src="${getAvatarPath(c, state.selectedSkin)}" alt="${c}">
      <span class="char-name">${c}</span>
    </div>
  `).join('');

  return `
    <div class="home-card">
      <h1>Perfil do Aluno</h1>
      <p class="home-sub">PIN de acesso: <strong>#${state.studentPin}</strong></p>
      
      <input type="text" id="player-name-input" class="input-name" placeholder="Seu Nome / Apelido" value="${state.playerName}">
      
      <p class="chip-label">Selecione o Personagem</p>
      <div class="char-grid">${charOptions}</div>

      <p class="chip-label">Visual (Skin)</p>
      <div class="skin-selector">
        <div class="skin-btn ${state.selectedSkin==='00'?'selected':''}" onclick="selectSkin('00')">
          <img src="${getAvatarPath(state.selectedChar, '00')}">
        </div>
        <div class="skin-btn ${state.selectedSkin==='01'?'selected':''}" onclick="selectSkin('01')">
          <img src="${getAvatarPath(state.selectedChar, '01')}">
        </div>
      </div>
    </div>
    <div class="footer-space"></div>

function selectChar(c){ state.selectedChar = c; render(); }
function selectSkin(s){ state.selectedSkin = s; render(); }

/* MONTAR QUADRADOS DE LETRAS */
function renderSpellingBoxes(target, selectedItems, checked, isCorrect, levelNum, fieldNum){
  let html = '<span class="word-spelling-wrap">';
  let itemIdx = 0;

  for(let i=0; i<target.length; i++){
    const charTarget = target[i];
    if(charTarget === ' '){
      html += `<span style="width: 8px;"></span>`;
    } else {
      const selectedObj = selectedItems[itemIdx];
      let cls = "letter-box";
      let displayChar = "";

      if(checked){
        cls += isCorrect ? " correct" : " wrong";
        if(selectedObj) displayChar = selectedObj.char;
      } else if(selectedObj){
        cls += " filled";
        displayChar = selectedObj.char;
      }

      const clickHandler = (!checked && selectedObj) ? `onclick="removeTile(${levelNum}, ${fieldNum}, ${itemIdx})"` : '';
      html += `<span class="${cls}" ${clickHandler}>${displayChar}</span>`;
      itemIdx++;
    }
  }
  html += '</span>';
  return html;
}

/* NÍVEL 1 */
function setupLevel1Question(idx){
  const q = level1Data[idx];
  state.l1 = {
    step: 'A', selectedItems: [], keyBank: buildKeyBank(q.targetSpelling),
    l2Opts: shuffle(q.l2Opts), l2Selected: null, checkedA: false,
    trOptions: shuffle([{text:q.transCorrect, correct:true}, ...q.transWrong.map(w=>({text:w, correct:false}))]),
    trSelected: null, checkedB: false
  };
}

function renderLevel1(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const target = q.targetSpelling;
    const typedString = s.selectedItems.map(item => item.char).join('');
    const expectedLettersOnly = target.replace(/ /g, '');
    const isSpellingOk = (typedString.toLowerCase() === expectedLettersOnly.toLowerCase());

    const spellingHtml = renderSpellingBoxes(target, s.selectedItems, s.checkedA, isSpellingOk, 1, 1);

    let l2Span = "[ ___ ]";
    if(s.l2Selected !== null) l2Span = s.l2Opts[s.l2Selected];
    let l2Cls = "blank";
    if(s.checkedA){
      l2Cls += (s.l2Opts[s.l2Selected] === q.l2Correct) ? " blank-correct" : " blank-wrong";
    } else if(s.l2Selected !== null) l2Cls += " blank-filled";

    const sentence = q.frTemplate.replace('{SPELLING}', spellingHtml).replace('[ 2 ]', `<span class="${l2Cls}">${l2Span}</span>`);

    const keyBtns = s.keyBank.map((item) => {
      const isUsed = s.selectedItems.some(sel => sel.id === item.id);
      let cls = 'key-btn' + (isUsed ? ' used' : '');
      const clickHandler = (!s.checkedA && !isUsed) ? `onclick="pickTile(1, 1, ${item.id})"` : '';
      return `<button class="${cls}" ${s.checkedA || isUsed ? 'disabled' : ''} ${clickHandler}>${item.char}</button>`;
    }).join('');

    const l2Btns = s.l2Opts.map((w,i)=>{
      let cls='chip-option';
      if(s.checkedA){ if(w===q.l2Correct) cls+=' correct'; else if(i===s.l2Selected) cls+=' wrong'; }
      else if(i===s.l2Selected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedA?'disabled':''} onclick="selectL1Opt(${i})">${w}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'Continuar' : 'Verificar Respostas';
    const btnOnclick = s.checkedA ? 'advanceL1Step()' : 'checkL1StepA()';
    const btnDisabled = !s.checkedA && (s.selectedItems.length < expectedLettersOnly.length || s.l2Selected===null);

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Monte as letras e escolha a palavra</p>
        <p class="fr-sentence">${sentence}</p>
        <p class="chip-label">Teclado de Letras</p>
        <div class="keyboard-grid">${keyBtns}</div>
        <p class="chip-label">Opções da Lacuna</p>
        <div class="chip-row">${l2Btns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL1Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'Ver Ranking da Rodada' : 'Verificar Tradução';
    const btnOnclick = s.checkedB ? 'showRankingScreen()' : 'checkL1Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function selectL1Opt(i){ playSound('click'); state.l1.l2Selected=i; renderLevel1(); }

function checkL1StepA(){
  const q = level1Data[state.qIndex];
  const s = state.l1;
  s.checkedA = true;

  const typedString = s.selectedItems.map(item => item.char).join('');
  const expectedLettersOnly = q.targetSpelling.replace(/ /g, '');
  const isSpellOk = (typedString.toLowerCase() === expectedLettersOnly.toLowerCase());
  const isL2Ok = (s.l2Opts[s.l2Selected] === q.l2Correct);

  let pts = 0;
  if(isSpellOk) pts += 25;
  if(isL2Ok) pts += 15;

  state.levelScores[1] += pts;
  state.totalScore += pts;

  if(isSpellOk && isL2Ok) playSound('ok'); else playSound('falha');
  renderLevel1();
}

function advanceL1Step(){ playSound('click'); state.l1.step='B'; renderLevel1(); }
function selectL1Translation(i){ playSound('click'); state.l1.trSelected=i; renderLevel1(); }

function checkL1Translation(){
  const s = state.l1;
  s.checkedB = true;
  if(s.trOptions[s.trSelected].correct){ playSound('ok'); } else { playSound('falha'); }
  renderLevel1();
}

/* NÍVEL 2 */
function setupLevel2Question(idx){
  const q = level2Data[idx];
  state.l2 = {
    step: 'A', activeField: 1, selectedItems1: [], selectedItems2: [],
    keyBank1: buildKeyBank(q.spelling1), keyBank2: buildKeyBank(q.spelling2),
    checkedA: false,
    trOptions: shuffle([{text:q.transCorrect, correct:true}, ...q.transWrong.map(w=>({text:w, correct:false}))]),
    trSelected: null, checkedB: false
  };
}

function renderLevel2(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  const content = document.getElementById('content');

  if(s.step==='A'){
    const typed1 = s.selectedItems1.map(i => i.char).join('');
    const typed2 = s.selectedItems2.map(i => i.char).join('');
    const expected1 = q.spelling1.replace(/ /g, '');
    const expected2 = q.spelling2.replace(/ /g, '');

    const isOk1 = (typed1.toLowerCase() === expected1.toLowerCase());
    const isOk2 = (typed2.toLowerCase() === expected2.toLowerCase());

    const sp1Html = renderSpellingBoxes(q.spelling1, s.selectedItems1, s.checkedA, isOk1, 2, 1);
    const sp2Html = renderSpellingBoxes(q.spelling2, s.selectedItems2, s.checkedA, isOk2, 2, 2);

    const sentence = q.frTemplate.replace('{SP1}', sp1Html).replace('[ 2 ]', sp2Html);

    const currentBank = s.activeField===1 ? s.keyBank1 : s.keyBank2;
    const currentSelected = s.activeField===1 ? s.selectedItems1 : s.selectedItems2;

    const keyBtns = currentBank.map((item) => {
      const isUsed = currentSelected.some(sel => sel.id === item.id);
      let cls = 'key-btn' + (isUsed ? ' used' : '');
      const clickHandler = (!s.checkedA && !isUsed) ? `onclick="pickTile(2, ${s.activeField}, ${item.id})"` : '';
      return `<button class="${cls}" ${s.checkedA || isUsed ? 'disabled' : ''} ${clickHandler}>${item.char}</button>`;
    }).join('');

    const btnLabel = s.checkedA ? 'Continuar' : 'Verificar Frases';
    const btnOnclick = s.checkedA ? 'advanceL2Step()' : 'checkL2StepA()';
    const btnDisabled = !s.checkedA && (s.selectedItems1.length < expected1.length || s.selectedItems2.length < expected2.length);

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Monte as duas lacunas letra por letra</p>
        <p class="fr-sentence">${sentence}</p>

        <div class="chip-row">
          <button class="chip-option ${s.activeField===1?'selected':''}" ${s.checkedA?'disabled':''} onclick="switchL2Field(1)">Lacuna 1</button>
          <button class="chip-option ${s.activeField===2?'selected':''}" ${s.checkedA?'disabled':''} onclick="switchL2Field(2)">Lacuna 2</button>
        </div>

        <p class="chip-label">Teclado da Lacuna ${s.activeField}</p>
        <div class="keyboard-grid">${keyBtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  } else {
    const trbtns = s.trOptions.map((o,i)=>{
      let cls='option-card';
      if(s.checkedB){ if(o.correct) cls+=' correct'; else if(i===s.trSelected) cls+=' wrong'; }
      else if(i===s.trSelected){ cls+=' selected'; }
      return `<button class="${cls}" ${s.checkedB?'disabled':''} onclick="selectL2Translation(${i})">${o.text}</button>`;
    }).join('');

    const btnLabel = s.checkedB ? 'Ver Ranking da Rodada' : 'Verificar Tradução';
    const btnOnclick = s.checkedB ? 'showRankingScreen()' : 'checkL2Translation()';
    const btnDisabled = !s.checkedB && s.trSelected===null;

    content.innerHTML = `
      <div class="question-card">
        <p class="instruction">Escolha a tradução correta</p>
        <p class="fr-sentence">${q.frFull}</p>
        <div class="options-grid">${trbtns}</div>
      </div>
      <div class="footer-space"></div>
      <button class="btn btn-block" ${btnDisabled?'disabled':''} onclick="${btnOnclick}">${btnLabel}</button>
    `;
  }
}

function switchL2Field(f){ playSound('click'); state.l2.activeField = f; renderLevel2(); }

function checkL2StepA(){
  const q = level2Data[state.qIndex];
  const s = state.l2;
  s.checkedA = true;

  const typed1 = s.selectedItems1.map(i => i.char).join('');
  const typed2 = s.selectedItems2.map(i => i.char).join('');
  const isOk1 = (typed1.toLowerCase() === q.spelling1.replace(/ /g, '').toLowerCase());
  const isOk2 = (typed2.toLowerCase() === q.spelling2.replace(/ /g, '').toLowerCase());

  let pts = 0;
  if(isOk1) pts += 22.5;
  if(isOk2) pts += 22.5;

  state.levelScores[2] += pts;
  state.totalScore += pts;

  if(isOk1 && isOk2) playSound('ok'); else playSound('falha');
  renderLevel2();
}

function advanceL2Step(){ playSound('click'); state.l2.step='B'; renderLevel2(); }
function selectL2Translation(i){ playSound('click'); state.l2.trSelected=i; renderLevel2(); }

function checkL2Translation(){
  const s = state.l2;
  s.checkedB = true;
  if(s.trOptions[s.trSelected].correct){
    playSound('ok');
    state.levelScores[2] += 15;
    state.totalScore += 15;
  } else { playSound('falha'); }
  renderLevel2();
}

/* ACOES TECLADO */
function pickTile(levelNum, fieldNum, itemId){
  playSound('click');
  const s = levelNum === 1 ? state.l1 : state.l2;
  if(levelNum === 1){
    const item = s.keyBank.find(k => k.id === itemId);
    if(item && !s.selectedItems.some(i => i.id === itemId)){
      s.selectedItems.push(item);
      renderLevel1();
    }
  } else {
    const bank = fieldNum === 1 ? s.keyBank1 : s.keyBank2;
    const selectedList = fieldNum === 1 ? s.selectedItems1 : s.selectedItems2;
    const item = bank.find(k => k.id === itemId);
    if(item && !selectedList.some(i => i.id === itemId)){
      selectedList.push(item);
      renderLevel2();
    }
  }
}

function removeTile(levelNum, fieldNum, itemIndex){
  playSound('click');
  const s = levelNum === 1 ? state.l1 : state.l2;
  if(!s.checkedA){
    if(levelNum === 1){
      s.selectedItems.splice(itemIndex, 1);
      renderLevel1();
    } else {
      const selectedList = fieldNum === 1 ? s.selectedItems1 : s.selectedItems2;
      selectedList.splice(itemIndex, 1);
      renderLevel2();
    }
  }
}

/* RANKING FLIP */
function renderRanking(currentTop10){
  const content = document.getElementById('content');
  const medals = { 1: "🥇", 2: "🥈", 3: "🥉" };

  const itemsHtml = currentTop10.map((item, index) => {
    const pos = index + 1;
    let posClass = `pos-${pos}`;
    if(pos > 3 && pos < 10) posClass = 'pos-mid';
    if(pos === 10) posClass = 'pos-10';

    const medal = medals[pos] || `${pos}º`;

    return `
      <div class="ranking-item ${posClass}" data-id="${item.id}" id="rank-item-${item.id}">
        <span class="rank-pos">${medal}</span>
        <img class="rank-avatar" src="${item.avatar}" alt="avatar">
        <span class="rank-name">${item.name}</span>
        <span class="rank-score">${formatScore(item.score)} pts</span>
      </div>
    `;
  }).join('');

  content.innerHTML = `
    <div class="ranking-card">
      <h2>Ranking Top 10</h2>
      <p class="instruction">Movimentação da rodada</p>
      <div class="ranking-list" id="ranking-container">${itemsHtml}</div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="nextQuestion()">Próxima Frase</button>
  `;

  requestAnimationFrame(() => {
    const container = document.getElementById('ranking-container');
    if(!container) return;

    currentTop10.forEach((item) => {
      const el = document.getElementById(`rank-item-${item.id}`);
      const oldPos = state.previousRanking.findIndex(p => p.id === item.id);
      const newPos = currentTop10.findIndex(p => p.id === item.id);

      if(oldPos !== -1 && oldPos !== newPos && el){
        const deltaY = (oldPos - newPos) * 48;
        el.style.transform = `translateY(${deltaY}px)`;
        el.style.transition = 'none';

        setTimeout(() => {
          el.style.transition = 'transform 0.8s ease-in-out';
          el.style.transform = 'translateY(0)';
        }, 50);
      }
    });

    state.previousRanking = [...currentTop10];
  });
}

function levelCompleteTemplate(){
  const lvl = state.level;
  const earned = state.levelScores[lvl];
  const max = lvl === 1 ? 400 : 600;
  const isLast = lvl === 2;

  return `
    <div class="home-card">
      <div class="mascot">🐓😄</div>
      <h1>Nível ${lvl} Concluído!</h1>
      <p class="home-sub">Pontuação do Nível: <strong>${formatScore(earned)} / ${max}</strong></p>
      <p class="home-sub">Pontuação Total: <strong>${formatScore(state.totalScore)} / 1000</strong></p>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="${isLast ? 'goFinal()' : 'startNextLevel()'}">
      ${isLast ? 'Ver Resultado Final' : 'Ir para o Nível ' + (lvl + 1)}
    </button>
  `;
}

function finalTemplate(){
  return `
    <div class="home-card">
      <div class="mascot">🐓🥳</div>
      <h1>Resultado Final</h1>
      <p class="final-score" style="font-size:40px; color:var(--green-dark); font-weight:800;">
        ${formatScore(state.totalScore)}<span> / 1000</span>
      </p>
      <div class="breakdown" style="width:100%;">
        <div style="display:flex; justify-content:space-between; padding:8px;"><span>Nível 1</span><span>${formatScore(state.levelScores[1])} / 400</span></div>
        <div style="display:flex; justify-content:space-between; padding:8px;"><span>Nível 2</span><span>${formatScore(state.levelScores[2])} / 600</span></div>
      </div>
    </div>
    <div class="footer-space"></div>
    <button class="btn btn-block" onclick="resetGame()">Jogar Novamente</button>
  `;
}

window.onload = () => { render(); };
</script>
